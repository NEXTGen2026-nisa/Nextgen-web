<!DOCTYPE html>
<html>
<head>
  <title>NextGen AI Studios</title>
  <style>
    /* Canlı ve Derin Neon Gece Arka Planı */
    body {
      background-color: #0b0f19;
      color: #00ffcc;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* Üst Menü Çubuğu */
    .menu-cubugu {
      background-color: #111726;
      border-bottom: 2px solid #00ffcc;
      padding: 15px 0;
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 255, 204, 0.3);
    }
    
    .logo-alani {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sirket-amblemi {
      background: linear-gradient(45deg, #00ffcc, #ff007f);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 10px #00ffcc;
    }
    .sirket-logosu {
      color: #00ffcc;
      font-weight: bold;
      font-size: 22px;
      letter-spacing: 1px;
    }

    /* 🌐 DİL BUTONLARI STİLİ */
    .dil-secici button {
      background: none;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 3px;
      transition: 0.3s;
    }
    .dil-secici button.aktif {
      background-color: #00ffcc;
      color: #111726;
      box-shadow: 0 0 10px #00ffcc;
    }

    /* İçerik Alanı */
    .icerik-alani {
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #00ffcc;
      font-size: 36px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    .slogan {
      color: #ffffff;
      font-size: 18px;
      margin-bottom: 40px;
    }

    /* Parlayan Kayıt Formu Kutusu */
    .form-kutusu {
      background-color: #222;
      border: 2px solid #00ffcc;
      padding: 30px;
      width: 300px;
      margin: 0 auto;
      border-radius: 15px;
      box-shadow: 0 0 15px #00ffcc;
    }
    .form-kutusu h3 {
      color: #ff007f;
      margin-top: 0;
      font-size: 20px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #00ffcc;
      background-color: #333;
      color: white;
      text-align: center;
    }
    button.ana-buton {
      background-color: #ff007f;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      box-shadow: 0 0 10px #ff007f;
    }

    /* Şifre Paneli */
    .sifre-kutusu {
      background-color: #222;
      border: 2px solid #ff007f;
      padding: 30px;
      width: 300px;
      margin: 40px auto 0 auto;
      border-radius: 15px;
      box-shadow: 0 0 15px #ff007f;
    }
    .sifre-kutusu h3 {
      color: #ff007f;
      margin-top: 0;
    }
    .sifre-kutusu input {
      border: 1px solid #ff007f;
    }
    button.sifre-buton {
      background-color: #00ffcc;
      color: #111;
      font-weight: bold;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      box-shadow: 0 0 10px #00ffcc;
    }

    .gizli-mesaj {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #00ffcc;
      color: #111;
      font-weight: bold;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 🌐 MENÜ ÇUBUĞU -->
  <div class="menu-cubugu">
    <div class="logo-alani">
      <div class="sirket-amblemi"></div>
      <div class="sirket-logosu">NextGen</div>
    </div>
    
    <!-- 🌐 DİL BUTONLARI BURADA -->
    <div class="dil-secici">
      <button id="btn-tr" class="aktif" onclick="diliDegistir('tr')">TR</button>
      <button id="btn-de" onclick="diliDegistir('de')">DE</button>
      <button id="btn-en" onclick="diliDegistir('en')">EN</button>
    </div>
  </div>

  <div class="icerik-alani">
    <h1 id="txt-baslik">Geleceğin Yazılım Dünyası</h1>
    <p id="txt-slogan" class="slogan">NextGen ile oyun ve yapay zeka fikirlerinizi kodla gerçeğe dönüştürüyoruz.</p>
    
    <!-- KAYIT FORMU -->
    <div class="form-kutusu">
      <h3 id="txt-form-baslik">Bizimle Çalışın</h3>
      <input type="text" id="isim" placeholder="Adınız Soyadınız">
      <input type="email" id="eposta" placeholder="E-posta Adresiniz">
      <button id="txt-form-buton" class="ana-buton" onclick="kaydet()">Kayıt Ol</button>
    </div>

    <!-- GIZLI PANEL -->
    <div class="sifre-kutusu">
      <h3 id="txt-panel-baslik">🔒 Kurucu Özel Paneli</h3>
      <input type="password" id="sifreGiris" placeholder="Yönetici Şifresi">
      <button id="txt-panel-buton" class="sifre-buton" onclick="sifreyiKontrolEt()">Sisteme Giriş Yap</button>
      <div id="gizliKutu" class="gizli-mesaj">
        🎉 HOŞ GELDİNİZ CEO! <br><br>
        18 yaşında atacağın büyük adımların temeli burada atılıyor. Asla pes etme! 🚀
      </div>
    </div>
  </div>

  <script>
    // 🧠 TÜM CÜMLELERİN ALMANCA VE İNGİLİZCE KARŞILIKLARI
    const sözlük = {
      tr: {
        baslik: "Geleceğin Yazılım Dünyası",
        slogan: "NextGen ile oyun ve yapay zeka fikirlerinizi kodla gerçeğe dönüştürüyoruz.",
        formBaslik: "Bizimle Çalışın",
        formButon: "Kayıt Ol",
        panelBaslik: "🔒 Kurucu Özel Paneli",
        panelButon: "Sisteme Giriş Yap",
        bosHata: "Lütfen tüm alanları doldurun!",
        tsekkur: "Teşekkürler ",
        kayitBasari: "! Kaydınız başarıyla alındı. Sizinle iletişime geçeceğiz.",
        sifreBasari: "Giriş Başarılı, Sayın Yönetici!",
        sifreHata: "Hatalı Şifre! ❌"
      },
      de: {
        baslik: "Die Softwarewelt der Zukunft",
        slogan: "Mit NextGen verwandeln wir Ihre Spiel- und KI-Ideen in Code.",
        formBaslik: "Arbeiten Sie mit uns",
        formButon: "Registrieren",
        panelBaslik: "🔒 Gründer-Sonderpanel",
        panelButon: "Einloggen",
        bosHata: "Bitte füllen Sie alle Felder aus!",
        tsekkur: "Vielen Dank ",
        kayitBasari: "! Ihre Registrierung war erfolgreich. Wir werden uns melden.",
        sifreBasari: "Login erfolgreich, Herr Geschäftsführer!",
        sifreHata: "Falsches Passwort! ❌"
      },
      en: {
        baslik: "The Software World of the Future",
        slogan: "With NextGen, we turn your game and AI ideas into code.",
        formBaslik: "Work With Us",
        formButon: "Sign Up",
        panelBaslik: "🔒 Founder Special Panel",
        panelButon: "Log In",
        bosHata: "Please fill in all fields!",
        tsekkur: "Thank you ",
        kayitBasari: "! Your registration was successful. We will contact you.",
        sifreBasari: "Login Successful, Welcome CEO!",
        sifreHata: "Incorrect Password! ❌"
      }
    };

    let aktifDil = 'tr';

    function diliDegistir(dil) {
      aktifDil = dil;
      document.getElementById('txt-baslik').innerText = sözlük[dil].baslik;
      document.getElementById('txt-slogan').innerText = sözlük[dil].slogan;
      document.getElementById('txt-form-baslik').innerText = sözlük[dil].formBaslik;
      document.getElementById('txt-form-buton').innerText = sözlük[dil].formButon;
      document.getElementById('txt-panel-baslik').innerText = sözlük[dil].panelBaslik;
      document.getElementById('txt-panel-buton').innerText = sözlük[dil].panelButon;

      // İsim ve Eposta kutularının içindeki silik yazıları (placeholder) değiştirme
      if(dil == 'de') {
        document.getElementById('isim').placeholder = "Ihr Name";
        document.getElementById('eposta').placeholder = "E-Mail Adresse";
        document.getElementById('sifreGiris').placeholder = "Admin-Passwort";
      } else if(dil == 'en') {
        document.getElementById('isim').placeholder = "Your Name";
        document.getElementById('eposta').placeholder = "Email Address";
        document.getElementById('sifreGiris').placeholder = "Admin Password";
      } else {
        document.getElementById('isim').placeholder = "Adınız Soyadınız";
        document.getElementById('eposta').placeholder = "E-posta Adresiniz";
        document.getElementById('sifreGiris').placeholder = "Yönetici Şifresi";
      }

      document.getElementById('btn-tr').classList.remove('aktif');
      document.getElementById('btn-de').classList.remove('aktif');
      document.getElementById('btn-en').classList.remove('aktif');
      document.getElementById('btn-' + dil).classList.add('aktif');
    }

    function kaydet() {
      let isimVerisi = document.getElementById('isim').value;
      let epostaVerisi = document.getElementById('eposta').value;

      if(isimVerisi == "" || epostaVerisi == "") {
        alert(sözlük[aktifDil].bosHata);
      } else {
        alert(sözlük[aktifDil].tsekkur + isimVerisi + sözlük[aktifDil].kayitBasari);
      }
    }

    function sifreyiKontrolEt() {
      let girilenSifre = document.getElementById('sifreGiris').value;
      if(girilenSifre == "2026") {
        document.getElementById('gizliKutu').style.display = "block";
        alert(sözlük[aktifDil].sifreBasari);
      } else {
        document.getElementById('gizliKutu').style.display = "none";
        alert(sözlük[aktifDil].sifreHata);
      }
    }
  </script>

</body>
</html>
